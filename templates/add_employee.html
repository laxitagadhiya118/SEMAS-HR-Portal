{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Add New Employee</h1>
        <p>Create a new employee profile and assign department, role and salary details.</p>
    </div>
</div>

<div class="form-card">

    <form method="POST">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control" placeholder="Enter first name" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control" placeholder="Enter last name" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="employee@example.com" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control" placeholder="Enter phone number">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Department</label>
                <input type="text" name="department" class="form-control" placeholder="e.g. IT, HR, Finance">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Position</label>
                <input type="text" name="position" class="form-control" placeholder="e.g. Junior Developer">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Hire Date</label>
                <input type="date" name="hire_date" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Salary</label>
                <input type="number" name="salary" class="form-control" placeholder="Enter salary">
            </div>

        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-success">Save Employee</button>
            <a href="/employees" class="btn btn-secondary">Cancel</a>
        </div>

    </form>

</div>

{% endblock %}
