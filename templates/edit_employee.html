{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit Employee</h1>
        <p>Update employee profile, job details and current employment status.</p>
    </div>
</div>

<div class="form-card">

    <form method="POST">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control"
                       value="{{ employee['first_name'] }}" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control"
                       value="{{ employee['last_name'] }}" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control"
                       value="{{ employee['email'] }}" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control"
                       value="{{ employee['phone'] }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Department</label>
                <input type="text" name="department" class="form-control"
                       value="{{ employee['department'] }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Position</label>
                <input type="text" name="position" class="form-control"
                       value="{{ employee['position'] }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Hire Date</label>
                <input type="date" name="hire_date" class="form-control"
                       value="{{ employee['hire_date'] }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Salary</label>
                <input type="number" name="salary" class="form-control"
                       value="{{ employee['salary'] }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Employment Status</label>
                <select name="status" class="form-select">
                    <option value="Active" {% if employee['status'] == 'Active' %}selected{% endif %}>Active</option>
                    <option value="Inactive" {% if employee['status'] == 'Inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>

        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-warning">Update Employee</button>
            <a href="/employees" class="btn btn-secondary">Cancel</a>
        </div>

    </form>

</div>

{% endblock %}
