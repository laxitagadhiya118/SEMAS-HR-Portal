```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEMAS HR Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div>
            <div class="sidebar-logo">
                <h2>SEMAS</h2>
                <p>HR Portal</p>
            </div>

            <!-- 3 Dots Dropdown Button -->
            <button class="menu-toggle" onclick="toggleSidebarMenu()">
                <span class="dots-icon">⋮</span>
                <span class="menu-label">Menu</span>
            </button>

            <!-- Dropdown Sidebar List -->
            <nav class="sidebar-menu" id="sidebarMenu">
                <a class="nav-item" href="/">📊 Dashboard</a>
                <a class="nav-item" href="/employees">👥 Employees</a>
                <a class="nav-item" href="/attendance">🕒 Attendance</a>
                <a class="nav-item" href="/leave-requests">📋 Leave Requests</a>
                <a class="nav-item" href="/reports">📑 Reports</a>
                <a class="nav-item logout-item" href="/logout">🚪 Logout</a>
            </nav>
        </div>

    </aside>

    <!-- Main Content -->
    <main class="content-area">

        <div class="topbar">
            <div>
                <h4>Workforce Management Platform</h4>
                <small>Smart Employee Management & Analytics System</small>
            </div>

            <div class="admin-box">
                Admin
            </div>
        </div>

        <div class="page-content">
            {% block content %}{% endblock %}
        </div>

    </main>

</div>

{% block scripts %}{% endblock %}

<script>
    function toggleSidebarMenu() {
        const menu = document.getElementById("sidebarMenu");
        menu.classList.toggle("show-menu");
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
